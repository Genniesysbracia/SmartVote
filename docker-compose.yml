version: "3.8"

services:
  mysql-master:
    image: mysql:8.0
    container_name: mysql-master
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: voterly
      MYSQL_USER: repl
      MYSQL_PASSWORD: replpassword
    ports:
      - "3307:3306"
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --binlog-do-db=voterly
    volumes:
      - master-data:/var/lib/mysql

  mysql-slave:
    image: mysql:8.0
    container_name: mysql-slave
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: voterly
      MYSQL_USER: repl
      MYSQL_PASSWORD: replpassword
    ports:
      - "3308:3306"
    command: >
      --server-id=2
      --log-bin=mysql-bin
      --relay-log=mysql-relay-bin
      --read-only=ON
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --replicate-do-db=voterly
    volumes:
      - slave-data:/var/lib/mysql
    depends_on:
      - mysql-master

volumes:
  master-data:
  slave-data:
